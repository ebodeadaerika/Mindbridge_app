# ── MindBridge — Render.com Blueprint ─────────────────────────────────────────
# Deploy the full stack (Backend API + Frontend) to Render.com in one click.
#
# Usage:
#   1. Push this repo to GitHub
#   2. Go to https://render.com → New → Blueprint
#   3. Connect your GitHub repo — Render auto-detects this file
#   4. After deploy, set AI_API_KEY and VITE_GOOGLE_CLIENT_ID in the dashboard
#
# Docs: https://render.com/docs/blueprint-spec
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend: FastAPI ─────────────────────────────────────────────────────────
  - type: web
    name: mindbridge-api
    runtime: docker
    dockerfilePath: ./mindbridge-backend/Dockerfile
    dockerContext: ./mindbridge-backend
    region: frankfurt          # Closest region to West Africa (Cameroon)
    plan: free
    startCommand: bash /app/start.sh

    envVars:
      # ── Database (auto-wired from managed Postgres below) ──────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: mindbridge-db
          property: connectionString

      # ── JWT Security ──────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true        # Render generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440                # 24 hours

      # ── AI Companion (Groq — free tier, no credit card) ──────────────────
      # Sign up at https://console.groq.com → API Keys → copy key
      - key: AI_API_KEY
        sync: false                # Fill in via Render dashboard after deploy
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_API_URL
        value: https://api.groq.com/openai/v1/chat/completions

      # ── Google OAuth (optional — for SSO) ────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false                # Fill in via Render dashboard if using SSO

      # ── CORS — allow both services to communicate ─────────────────────────
      # After first deploy, update with your actual frontend URL
      - key: CORS_ORIGINS
        value: https://mindbridge-api.onrender.com,https://mindbridge-frontend.onrender.com,http://localhost:5173

      # ── Application ───────────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: MindBridge
      - key: APP_VERSION
        value: "1.0.0"

      # ── Database pool (keep small for free 256 MB Postgres) ───────────────
      - key: DB_POOL_SIZE
        value: 3
      - key: DB_MAX_OVERFLOW
        value: 5

  # ── Frontend: React + Vite (static site) ─────────────────────────────────────
  - type: web
    name: mindbridge-frontend
    runtime: static
    rootDir: ./mindbridge-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    region: frankfurt
    plan: free

    # Rewrite all paths → index.html for client-side React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # API URL — points to the backend service deployed above
      - key: VITE_API_URL
        value: https://mindbridge-api.onrender.com/api/v1
      # Google OAuth Client ID (optional — leave blank if not using Google SSO)
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

# ── Managed PostgreSQL Database ───────────────────────────────────────────────
databases:
  - name: mindbridge-db
    plan: free                     # 256 MB RAM, 1 GB storage, 90-day free period
    databaseName: mindbridge_db
    user: mindbridge_user
    region: frankfurt
