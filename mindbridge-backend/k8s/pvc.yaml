# ── MindBridge — PersistentVolumeClaim ───────────────────────────────────────
# PostgreSQL data persists across pod restarts (NFR-13)

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mindbridge-postgres-pvc
  namespace: mindbridge
  labels:
    app: mindbridge
    component: db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard  # Use 'standard' for Minikube; adjust for production
