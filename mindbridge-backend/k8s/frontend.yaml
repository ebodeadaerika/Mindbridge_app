# ── MindBridge — Frontend Deployment & Service ───────────────────────────────
# React + Nginx — serves the compiled SPA to users
# Apply: kubectl apply -f k8s/frontend.yaml -n mindbridge

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindbridge-frontend
  namespace: mindbridge
  labels:
    app: mindbridge
    component: frontend
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindbridge
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mindbridge
        component: frontend
    spec:
      containers:
        - name: mindbridge-frontend
          image: yourdockerhubuser/mindbridge-frontend:latest
          imagePullPolicy: IfNotPresent   # IfNotPresent for Minikube local builds
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: mindbridge-frontend-service
  namespace: mindbridge
  labels:
    app: mindbridge
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: mindbridge
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
