# ── MindBridge — Horizontal Pod Autoscaler ───────────────────────────────────
# Scale when CPU > 70% (NFR-23)
# min: 2 replicas (NFR-11) | max: 8 replicas

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mindbridge-api-hpa
  namespace: mindbridge
  labels:
    app: mindbridge
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mindbridge-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # NFR-23: scale up when CPU > 70%
    # Also scale on memory
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
