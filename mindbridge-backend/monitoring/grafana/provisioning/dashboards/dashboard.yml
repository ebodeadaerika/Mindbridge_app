# ── MindBridge — Grafana Dashboard Provider ────────────────────────────────────
# Automatically loads JSON dashboards from the /dashboards directory

apiVersion: 1

providers:
  - name: MindBridge Dashboards
    orgId: 1
    folder: MindBridge
    folderUid: mindbridge
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
