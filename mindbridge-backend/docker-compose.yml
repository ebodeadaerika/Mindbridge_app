# ── MindBridge — Docker Compose ───────────────────────────────────────────────
# Runs: FastAPI backend + PostgreSQL + Prometheus + Grafana
# Usage: docker compose up --build
# Swagger UI: http://localhost:8000/docs
# Frontend dev: npm run dev → http://localhost:5173

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: mindbridge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindbridge_db
      POSTGRES_USER: mindbridge_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindbridge_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port NOT exposed publicly — internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge_user -d mindbridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindbridge_network

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mindbridge_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mindbridge_user:${DB_PASSWORD:-mindbridge_pass}@db:5432/mindbridge_db
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - mindbridge_network

  # ── Database Migrations (runs once on startup) ──────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mindbridge_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mindbridge_user:mindbridge_pass@db:5432/mindbridge_db
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: on-failure
    networks:
      - mindbridge_network

  # ── Prometheus Monitoring ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mindbridge_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    networks:
      - mindbridge_network

  # ── Grafana Dashboards ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: mindbridge_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: mindbridge123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - mindbridge_network

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  mindbridge_network:
    driver: bridge
