# ── MindBridge — Ansible Inventory ───────────────────────────────────────────
# Replace <YOUR_VPS_IP> with your Oracle Cloud Free Tier instance IP

[mindbridge_servers]
mindbridge-prod ansible_host=<YOUR_VPS_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/oracle_cloud_key

[mindbridge_servers:vars]
ansible_python_interpreter=/usr/bin/python3
