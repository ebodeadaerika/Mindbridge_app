# ── MindBridge — Ansible Inventory ───────────────────────────────────────────
# Replace <YOUR_AWS_IP> with your EC2 instance Public IPv4 address
# Replace aws_key with the name you give to your .pem file in WSL2 ~/.ssh/

[mindbridge_servers]
mindbridge-prod ansible_host=13.60.57.180 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/aws_key

[mindbridge_servers:vars]
ansible_python_interpreter=/usr/bin/python3
