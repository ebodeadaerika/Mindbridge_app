---
# ── MindBridge — Ansible Playbook 2: Deploy Application ──────────────────────
# Section 5 (2.5 marks) — Starts containers, configures Nginx reverse proxy
# Run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy_app.yml

- name: MindBridge — Deploy Application
  hosts: mindbridge_servers
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/mindbridge
    git_repo: "https://github.com/your-team/mindbridge-backend.git"
    git_branch: main

  tasks:

    # ── Application Directory ───────────────────────────────────────────────
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # ── Clone / Pull Code ───────────────────────────────────────────────────
    - name: Clone or update application code
      git:
        repo: "{{ git_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ git_branch }}"
        force: yes
      become_user: ubuntu

    # ── Environment File ────────────────────────────────────────────────────
    - name: Copy .env file to server
      template:
        src: templates/.env.j2
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      notify: Restart containers

    # ── Docker Compose ──────────────────────────────────────────────────────
    - name: Pull latest Docker images
      command: docker compose pull
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Start application containers
      command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Run database migrations
      command: docker compose exec -T api alembic upgrade head
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      retries: 3
      delay: 5

    # ── Nginx Reverse Proxy ─────────────────────────────────────────────────
    - name: Create Nginx configuration for MindBridge
      copy:
        dest: /etc/nginx/sites-available/mindbridge
        content: |
          server {
              listen 80;
              server_name _;

              # API proxy
              location /api/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }

              # Swagger docs
              location /docs {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
              }

              # Health check
              location /health {
                  proxy_pass http://127.0.0.1:8000;
              }

              # Frontend (if serving static files)
              location / {
                  root /opt/mindbridge/frontend-dist;
                  try_files $uri $uri/ /index.html;
              }
          }

    - name: Enable site configuration
      file:
        src: /etc/nginx/sites-available/mindbridge
        dest: /etc/nginx/sites-enabled/mindbridge
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    # ── Verification ────────────────────────────────────────────────────────
    - name: Wait for API to be ready
      uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      retries: 10
      delay: 5
      register: health_check
      until: health_check.status == 200

    - name: Display deployment status
      debug:
        msg: |
          ✅ MindBridge deployed successfully!
          API:    http://{{ ansible_host }}/api/v1
          Docs:   http://{{ ansible_host }}/docs
          Health: http://{{ ansible_host }}/health

  # ── Handlers ───────────────────────────────────────────────────────────────
  handlers:
    - name: Restart containers
      command: docker compose restart
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
