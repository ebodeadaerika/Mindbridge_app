---
# ── MindBridge — Ansible Playbook 2: Deploy Application ──────────────────────
# Section 5 (2.5 marks) — Copies code, starts containers, configures Nginx
# Run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy_app.yml

- name: MindBridge — Deploy Application
  hosts: mindbridge_servers
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../vars/production.yml"

  vars:
    app_dir: /opt/mindbridge
    local_src: "{{ playbook_dir }}/../../"   # mindbridge-backend/ folder

  tasks:

    # ── Application Directory ───────────────────────────────────────────────
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # ── Sync Code to VPS (no GitHub required) ──────────────────────────────
    - name: Sync application code to server
      synchronize:
        src: "{{ local_src }}"
        dest: "{{ app_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.env"
          - "--exclude=htmlcov"
          - "--exclude=.pytest_cache"
          - "--exclude=node_modules"
          - "--exclude=venv"
          - "--exclude=.venv"
      become: false

    # ── Environment File ────────────────────────────────────────────────────
    - name: Deploy .env file from template
      template:
        src: "{{ playbook_dir }}/../templates/.env.j2"
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    # ── Docker Compose ──────────────────────────────────────────────────────
    - name: Build and start containers
      command: docker compose up -d --build
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    - name: Wait for database to be ready
      command: docker compose exec -T db pg_isready -U mindbridge_user -d mindbridge_db
      args:
        chdir: "{{ app_dir }}"
      register: db_ready
      until: db_ready.rc == 0
      retries: 12
      delay: 5
      become_user: ubuntu

    - name: Run database migrations
      command: docker compose exec -T api alembic upgrade head
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu

    # ── Nginx Reverse Proxy ─────────────────────────────────────────────────
    - name: Deploy Nginx configuration
      copy:
        dest: /etc/nginx/sites-available/mindbridge
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 10M;

              # API — all /api/ and /docs /health /metrics routes
              location ~ ^/(api|docs|redoc|openapi.json|health|metrics) {
                  proxy_pass         http://127.0.0.1:8000;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }

              # Grafana
              location /grafana/ {
                  proxy_pass http://127.0.0.1:3001/;
                  proxy_set_header Host $host;
              }

              # Frontend — SPA catch-all
              location / {
                  proxy_pass http://127.0.0.1:5173;
                  proxy_set_header Host $host;
                  proxy_set_header Upgrade    $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }

    - name: Enable MindBridge site
      file:
        src:  /etc/nginx/sites-available/mindbridge
        dest: /etc/nginx/sites-enabled/mindbridge
        state: link

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      ignore_errors: true

    - name: Test Nginx config
      command: nginx -t
      changed_when: false

    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded

    # ── UFW — allow port 8000 for direct API access ─────────────────────────
    - name: Allow port 8000 (API direct access)
      ufw:
        rule: allow
        port: "8000"

    # ── Health check ────────────────────────────────────────────────────────
    - name: Wait for API health endpoint
      uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      retries: 12
      delay: 5
      register: health
      until: health.status == 200

    - name: Deployment complete
      debug:
        msg: |
          ============================================================
          MindBridge deployed successfully!
          API:      http://{{ ansible_host }}/api/v1
          Docs:     http://{{ ansible_host }}/docs
          Health:   http://{{ ansible_host }}/health
          Grafana:  http://{{ ansible_host }}:3001  (admin/mindbridge123)
          Prometheus: http://{{ ansible_host }}:9090
          ============================================================

  handlers:
    - name: restart containers
      command: docker compose restart
      args:
        chdir: "{{ app_dir }}"
      become_user: ubuntu
