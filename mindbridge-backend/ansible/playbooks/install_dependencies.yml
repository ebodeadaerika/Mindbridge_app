---
# ── MindBridge — Ansible Playbook 1: Install Dependencies ────────────────────
# Section 5 (2.5 marks) — Installs Docker, Python 3.11, Git, Nginx on the VPS
# Run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/install_dependencies.yml

- name: MindBridge — Install Server Dependencies
  hosts: mindbridge_servers
  become: true
  gather_facts: true

  vars:
    docker_compose_version: "v2.24.0"
    python_version: "3.11"

  tasks:

    # ── System Updates ──────────────────────────────────────────────────────
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install system prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - git
          - wget
          - ufw
          - rsync
        state: present

    # ── Docker Installation ─────────────────────────────────────────────────
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Get system dpkg architecture (amd64 / arm64)
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: yes

    - name: Detect system architecture
      command: uname -m
      register: arch
      changed_when: false

    - name: Set Docker Compose binary name for architecture
      set_fact:
        compose_arch: "{{ 'aarch64' if arch.stdout == 'aarch64' else 'x86_64' }}"

    - name: Install Docker Compose plugin
      get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ compose_arch }}"
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    # ── Python 3.11 Installation ────────────────────────────────────────────
    - name: Add Python deadsnakes PPA
      apt_repository:
        repo: "ppa:deadsnakes/ppa"
        state: present

    - name: Install Python 3.11
      apt:
        name:
          - python3.11
          - python3.11-venv
          - python3.11-dev
          - python3-pip
        state: present
        update_cache: yes

    # ── Nginx Installation ──────────────────────────────────────────────────
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Start and enable Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    # ── Firewall Rules ──────────────────────────────────────────────────────
    - name: Allow SSH (port 22)
      ufw:
        rule: allow
        port: "22"

    - name: Allow HTTP (port 80)
      ufw:
        rule: allow
        port: "80"

    - name: Allow HTTPS (port 443)
      ufw:
        rule: allow
        port: "443"

    - name: Enable UFW firewall
      ufw:
        state: enabled
        policy: deny

    # ── Verification ────────────────────────────────────────────────────────
    - name: Verify Docker version
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "Docker installed: {{ docker_version.stdout }}"

    - name: Verify Python version
      command: python3.11 --version
      register: python_ver
      changed_when: false

    - name: Display Python version
      debug:
        msg: "Python installed: {{ python_ver.stdout }}"
